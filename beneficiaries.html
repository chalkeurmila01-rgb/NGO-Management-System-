<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Beneficiary Management - NGO Management System</title>

<script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-50 text-gray-800"><!-- Navbar -->
<nav class="bg-blue-700 text-white p-4">

    <div class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>

        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">
            Back to Admin
        </a>

    </div>

</nav>


<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 py-10">

    <!-- Heading -->
    <div class="mb-8">

        <h2 class="text-3xl font-bold text-blue-700">
            Beneficiary Management
        </h2>

        <p class="text-gray-600 mt-2">
            Add and manage NGO beneficiary records.
        </p>

    </div>


    <!-- Add / Edit Beneficiary -->
    <section class="bg-white p-6 rounded-xl shadow-md">

        <h3
            id="formTitle"
            class="text-2xl font-bold text-blue-700 mb-6">
            Add Beneficiary
        </h3>


        <form id="beneficiaryForm">

            <!-- Name -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Beneficiary Name
                </label>

                <input
                    type="text"
                    id="beneficiaryName"
                    placeholder="Enter beneficiary name"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Email -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Email
                </label>

                <input
                    type="email"
                    id="beneficiaryEmail"
                    placeholder="Enter beneficiary email"
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Phone -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="beneficiaryPhone"
                    placeholder="Enter phone number"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Address -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Address
                </label>

                <textarea
                    id="beneficiaryAddress"
                    placeholder="Enter beneficiary address"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3"></textarea>

            </div>


            <!-- Assistance -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Assistance Required
                </label>

                <select
                    id="assistanceRequired"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

                    <option value="">
                        Select assistance
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Medical">
                        Medical
                    </option>

                    <option value="Financial">
                        Financial
                    </option>

                    <option value="Shelter">
                        Shelter
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Registration Date -->
            <div class="mb-6">

                <label class="block font-medium mb-1">
                    Registration Date
                </label>

                <input
                    type="date"
                    id="registrationDate"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Buttons -->
            <div class="flex gap-3">

                <button
                    type="submit"
                    id="submitBeneficiaryBtn"
                    class="bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800">

                    Add Beneficiary

                </button>


                <button
                    type="button"
                    id="cancelEditBtn"
                    class="hidden bg-gray-500 text-white px-6 py-3 rounded-lg font-semibold">

                    Cancel

                </button>

            </div>

        </form>

    </section>


    <!-- Beneficiary Records -->
    <section class="bg-white p-6 rounded-xl shadow-md mt-8">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Beneficiary Records
        </h3>


        <!-- Search -->
        <div class="mb-6">

            <input
                type="text"
                id="searchBeneficiary"
                placeholder="Search beneficiary, email or assistance..."
                class="w-full border border-gray-300 rounded-lg p-3">

        </div>


        <div id="beneficiaryList">

            <p class="text-gray-500">
                Loading beneficiaries...
            </p>

        </div>

    </section>

</main>


<!-- Footer -->
<footer class="bg-gray-800 text-white text-center p-5 mt-10">

    <p>
        NGO Management System
    </p>

    <p class="text-gray-400 text-sm mt-1">
        Beneficiary Management
    </p>

    <p class="text-gray-400 text-sm mt-2">
        © 2026 NGO Management System
    </p>

</footer>


<!-- Authentication -->
<script type="module" src="auth.js"></script>


<!-- Beneficiary Management JavaScript -->
<script type="module">

    import {
        ref,
        push,
        set,
        get,
        update,
        remove
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    import {
        db
    } from "./firebase.js";


    // =========================================
    // ELEMENTS
    // =========================================

    const beneficiaryForm =
        document.getElementById("beneficiaryForm");

    const formTitle =
        document.getElementById("formTitle");

    const submitBeneficiaryBtn =
        document.getElementById("submitBeneficiaryBtn");

    const cancelEditBtn =
        document.getElementById("cancelEditBtn");

    const beneficiaryName =
        document.getElementById("beneficiaryName");

    const beneficiaryEmail =
        document.getElementById("beneficiaryEmail");

    const beneficiaryPhone =
        document.getElementById("beneficiaryPhone");

    const beneficiaryAddress =
        document.getElementById("beneficiaryAddress");

    const assistanceRequired =
        document.getElementById("assistanceRequired");

    const registrationDate =
        document.getElementById("registrationDate");

    const beneficiaryList =
        document.getElementById("beneficiaryList");

    const searchBeneficiary =
        document.getElementById("searchBeneficiary");


    // =========================================
    // EDITING ID
    // =========================================

    let editingBeneficiaryId = null;


    // =========================================
    // ADD / UPDATE
    // =========================================

    beneficiaryForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                beneficiaryName.value.trim();

            const email =
                beneficiaryEmail.value.trim();

            const phone =
                beneficiaryPhone.value.trim();

            const address =
                beneficiaryAddress.value.trim();

            const assistance =
                assistanceRequired.value;

            const date =
                registrationDate.value;


            try {

                // UPDATE
                if (editingBeneficiaryId) {

                    const beneficiaryRef =
                        ref(
                            db,
                            "beneficiaries/" +
                            editingBeneficiaryId
                        );


                    await update(
                        beneficiaryRef,
                        {

                            name: name,

                            email: email,

                            phone: phone,

                            address: address,

                            assistanceRequired:
                                assistance,

                            registrationDate:
                                date

                        }
                    );


                    alert(
                        "Beneficiary updated successfully!"
                    );

                }


                // ADD
                else {

                    const beneficiariesRef =
                        ref(
                            db,
                            "beneficiaries"
                        );


                    const newBeneficiaryRef =
                        push(
                            beneficiariesRef
                        );


                    await set(
                        newBeneficiaryRef,
                        {

                            name: name,

                            email: email,

                            phone: phone,

                            address: address,

                            assistanceRequired:
                                assistance,

                            registrationDate:
                                date

                        }
                    );


                    alert(
                        "Beneficiary added successfully!"
                    );

                }


                resetForm();

                loadBeneficiaries();

            } catch (error) {

                console.error(
                    "Beneficiary error:",
                    error
                );

                alert(
                    "Operation failed: " +
                    error.message
                );

            }

        }
    );


    // =========================================
    // LOAD BENEFICIARIES
    // =========================================

    async function loadBeneficiaries() {

        try {

            const beneficiariesRef =
                ref(
                    db,
                    "beneficiaries"
                );


            const snapshot =
                await get(
                    beneficiariesRef
                );


            beneficiaryList.innerHTML = "";


            if (!snapshot.exists()) {

                beneficiaryList.innerHTML = `

                    <p class="text-gray-500">
                        No beneficiaries found.
                    </p>

                `;

                return;
            }


            const beneficiaries =
                snapshot.val();


            const searchText =
                searchBeneficiary.value
                    .trim()
                    .toLowerCase();


            let found = false;


            Object.keys(beneficiaries)
                .forEach((id) => {

                    const beneficiary =
                        beneficiaries[id];


                    const searchableText =

                        (
                            beneficiary.name +
                            " " +
                            beneficiary.email +
                            " " +
                            beneficiary.assistanceRequired
                        )
                        .toLowerCase();


                    if (
                        searchText &&
                        !searchableText.includes(
                            searchText
                        )
                    ) {

                        return;

                    }


                    found = true;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "border border-gray-200 rounded-xl p-5 mb-4";


                    card.innerHTML = `

                        <h4 class="text-xl font-bold text-blue-700">
                            ${beneficiary.name}
                        </h4>

                        <p class="text-gray-600 mt-2">
                            <strong>Email:</strong>
                            ${beneficiary.email || "Not provided"}
                        </p>

                        <p class="text-gray-600">
                            <strong>Phone:</strong>
                            ${beneficiary.phone}
                        </p>

                        <p class="text-gray-600">
                            <strong>Address:</strong>
                            ${beneficiary.address}
                        </p>

                        <p class="text-gray-600">
                            <strong>Assistance:</strong>
                            ${beneficiary.assistanceRequired}
                        </p>

                        <p class="text-gray-600">
                            <strong>Registration Date:</strong>
                            ${beneficiary.registrationDate}
                        </p>

                        <div class="flex gap-3 mt-4">

                            <button
                                class="edit-btn bg-yellow-500 text-white px-4 py-2 rounded-lg"
                                data-id="${id}">

                                Edit

                            </button>

                            <button
                                class="delete-btn bg-red-600 text-white px-4 py-2 rounded-lg"
                                data-id="${id}">

                                Delete

                            </button>

                        </div>

                    `;


                    beneficiaryList.appendChild(
                        card
                    );

                });


            if (!found) {

                beneficiaryList.innerHTML = `

                    <p class="text-gray-500">
                        No matching beneficiaries found.
                    </p>

                `;

            }


            // EDIT BUTTONS
            document
                .querySelectorAll(".edit-btn")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            editBeneficiary(
                                button.dataset.id,
                                beneficiaries
                            );

                        }
                    );

                });


            // DELETE BUTTONS
            document
                .querySelectorAll(".delete-btn")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteBeneficiary(
                                button.dataset.id
                            );

                        }
                    );

                });


        } catch (error) {

            console.error(
                "Error loading beneficiaries:",
                error
            );

            beneficiaryList.innerHTML = `

                <p class="text-red-600">
                    Error loading beneficiaries.
                </p>

            `;

        }

    }


    // =========================================
    // EDIT
    // =========================================

    function editBeneficiary(
        id,
        beneficiaries
    ) {

        const beneficiary =
            beneficiaries[id];


        if (!beneficiary) {

            return;

        }


        editingBeneficiaryId =
            id;


        beneficiaryName.value =
            beneficiary.name || "";

        beneficiaryEmail.value =
            beneficiary.email || "";

        beneficiaryPhone.value =
            beneficiary.phone || "";

        beneficiaryAddress.value =
            beneficiary.address || "";

        assistanceRequired.value =
            beneficiary.assistanceRequired || "";

        registrationDate.value =
            beneficiary.registrationDate || "";


        formTitle.textContent =
            "Edit Beneficiary";


        submitBeneficiaryBtn.textContent =
            "Update Beneficiary";


        cancelEditBtn.classList.remove(
            "hidden"
        );


        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );

    }


    // =========================================
    // DELETE
    // =========================================

    async function deleteBeneficiary(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this beneficiary?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const beneficiaryRef =
                ref(
                    db,
                    "beneficiaries/" + id
                );


            await remove(
                beneficiaryRef
            );


            alert(
                "Beneficiary deleted successfully!"
            );


            loadBeneficiaries();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Delete failed: " +
                error.message
            );

        }

    }


    // =========================================
    // CANCEL EDIT
    // =========================================

    cancelEditBtn.addEventListener(
        "click",
        () => {

            resetForm();

        }
    );


    // =========================================
    // RESET FORM
    // =========================================

    function resetForm() {

        beneficiaryForm.reset();

        editingBeneficiaryId =
            null;

        formTitle.textContent =
            "Add Beneficiary";

        submitBeneficiaryBtn.textContent =
            "Add Beneficiary";

        cancelEditBtn.classList.add(
            "hidden"
        );

    }


    // =========================================
    // SEARCH
    // =========================================

    searchBeneficiary.addEventListener(
        "input",
        () => {

            loadBeneficiaries();

        }
    );


    // =========================================
    // INITIAL LOAD
    // =========================================

    loadBeneficiaries();

</script>

</body>
</html>
