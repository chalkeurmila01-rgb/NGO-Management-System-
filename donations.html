<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Donation Management - NGO Management System</title>

<script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-50 text-gray-800"><!-- Navbar -->
<nav class="bg-blue-700 text-white p-4">

    <div class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>

        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">
            Back to Admin
        </a>

    </div>

</nav>


<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 py-10">

    <!-- Heading -->
    <div class="mb-8">

        <h2 class="text-3xl font-bold text-blue-700">
            Donation Management
        </h2>

        <p class="text-gray-600 mt-2">
            Add and manage NGO donation records.
        </p>

    </div>


    <!-- Add / Edit Donation Form -->
    <section class="bg-white p-6 rounded-xl shadow-md">

        <h3
            id="formTitle"
            class="text-2xl font-bold text-blue-700 mb-6">
            Add Donation
        </h3>


        <form id="donationForm">

            <!-- Donor Name -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donor Name
                </label>

                <input
                    type="text"
                    id="donorName"
                    placeholder="Enter donor name"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Donor Email -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donor Email
                </label>

                <input
                    type="email"
                    id="donorEmail"
                    placeholder="Enter donor email"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Amount -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Amount
                </label>

                <input
                    type="number"
                    id="donationAmount"
                    placeholder="Enter donation amount"
                    min="1"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Donation Type -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Type
                </label>

                <select
                    id="donationType"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

                    <option value="">
                        Select donation type
                    </option>

                    <option value="Money">
                        Money
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Clothes">
                        Clothes
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Date -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Date
                </label>

                <input
                    type="date"
                    id="donationDate"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Notes -->
            <div class="mb-6">

                <label class="block font-medium mb-1">
                    Notes
                </label>

                <textarea
                    id="donationNotes"
                    placeholder="Enter donation details"
                    class="w-full border border-gray-300 rounded-lg p-3"></textarea>

            </div>


            <!-- Buttons -->
            <div class="flex gap-3">

                <button
                    type="submit"
                    id="submitDonationBtn"
                    class="bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800">

                    Add Donation

                </button>


                <button
                    type="button"
                    id="cancelEditBtn"
                    class="hidden bg-gray-500 text-white px-6 py-3 rounded-lg font-semibold">

                    Cancel

                </button>

            </div>

        </form>

    </section>


    <!-- Donation Records -->
    <section class="bg-white p-6 rounded-xl shadow-md mt-8">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Donation Records
        </h3>


        <!-- Search -->
        <div class="mb-6">

            <input
                type="text"
                id="searchDonation"
                placeholder="Search donor, email or donation type..."
                class="w-full border border-gray-300 rounded-lg p-3">

        </div>


        <div id="donationList">

            <p class="text-gray-500">
                Loading donations...
            </p>

        </div>

    </section>

</main>


<!-- Footer -->
<footer class="bg-gray-800 text-white text-center p-5 mt-10">

    <p>
        NGO Management System
    </p>

    <p class="text-gray-400 text-sm mt-1">
        Donation Management
    </p>

    <p class="text-gray-400 text-sm mt-2">
        © 2026 NGO Management System
    </p>

</footer>


<!-- Authentication -->
<script type="module" src="auth.js"></script>


<!-- Donation Management JavaScript -->
<script type="module">

    import {
        ref,
        push,
        set,
        get,
        update,
        remove
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    import {
        db
    } from "./firebase.js";


    // =========================================
    // ELEMENTS
    // =========================================

    const donationForm =
        document.getElementById("donationForm");

    const formTitle =
        document.getElementById("formTitle");

    const submitDonationBtn =
        document.getElementById("submitDonationBtn");

    const cancelEditBtn =
        document.getElementById("cancelEditBtn");

    const donorName =
        document.getElementById("donorName");

    const donorEmail =
        document.getElementById("donorEmail");

    const donationAmount =
        document.getElementById("donationAmount");

    const donationType =
        document.getElementById("donationType");

    const donationDate =
        document.getElementById("donationDate");

    const donationNotes =
        document.getElementById("donationNotes");

    const donationList =
        document.getElementById("donationList");

    const searchDonation =
        document.getElementById("searchDonation");


    // =========================================
    // EDITING ID
    // =========================================

    let editingDonationId = null;


    // =========================================
    // ADD / UPDATE DONATION
    // =========================================

    donationForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                donorName.value.trim();

            const email =
                donorEmail.value.trim();

            const amount =
                donationAmount.value;

            const type =
                donationType.value;

            const date =
                donationDate.value;

            const notes =
                donationNotes.value.trim();


            try {

                // =================================
                // UPDATE EXISTING DONATION
                // =================================

                if (editingDonationId) {

                    const donationRef =
                        ref(
                            db,
                            "donations/" +
                            editingDonationId
                        );


                    await update(
                        donationRef,
                        {

                            donorName: name,

                            donorEmail: email,

                            amount: Number(amount),

                            donationType: type,

                            donationDate: date,

                            notes: notes

                        }
                    );


                    alert(
                        "Donation updated successfully!"
                    );


                }

                // =================================
                // ADD NEW DONATION
                // =================================

                else {

                    const donationsRef =
                        ref(db, "donations");


                    const newDonationRef =
                        push(donationsRef);


                    await set(
                        newDonationRef,
                        {

                            donorName: name,

                            donorEmail: email,

                            amount: Number(amount),

                            donationType: type,

                            donationDate: date,

                            notes: notes

                        }
                    );


                    alert(
                        "Donation added successfully!"
                    );

                }


                resetForm();

                loadDonations();


            } catch (error) {

                console.error(
                    "Donation error:",
                    error
                );

                alert(
                    "Operation failed: " +
                    error.message
                );

            }

        }
    );


    // =========================================
    // LOAD DONATIONS
    // =========================================

    async function loadDonations() {

        try {

            const donationsRef =
                ref(db, "donations");


            const snapshot =
                await get(donationsRef);


            donationList.innerHTML = "";


            if (!snapshot.exists()) {

                donationList.innerHTML = `

                    <p class="text-gray-500">
                        No donations found.
                    </p>

                `;

                return;
            }


            const donations =
                snapshot.val();


            const searchText =
                searchDonation.value
                    .trim()
                    .toLowerCase();


            let found =
                false;


            Object.keys(donations)
                .forEach((id) => {

                    const donation =
                        donations[id];


                    const searchableText =

                        (
                            donation.donorName +
                            " " +
                            donation.donorEmail +
                            " " +
                            donation.donationType
                        )
                        .toLowerCase();


                    // Search filter
                    if (
                        searchText &&
                        !searchableText.includes(
                            searchText
                        )
                    ) {

                        return;

                    }


                    found = true;


                    const card =
                        document.createElement("div");


                    card.className =
                        "border border-gray-200 rounded-xl p-5 mb-4";


                    card.innerHTML = `

                        <h4 class="text-xl font-bold text-blue-700">
                            ${donation.donorName}
                        </h4>

                        <p class="text-gray-600 mt-2">
                            <strong>Email:</strong>
                            ${donation.donorEmail}
                        </p>

                        <p class="text-gray-600">
                            <strong>Amount:</strong>
                            ₹${donation.amount}
                        </p>

                        <p class="text-gray-600">
                            <strong>Type:</strong>
                            ${donation.donationType}
                        </p>

                        <p class="text-gray-600">
                            <strong>Date:</strong>
                            ${donation.donationDate}
                        </p>

                        <p class="text-gray-600">
                            <strong>Notes:</strong>
                            ${donation.notes || "No notes"}
                        </p>

                        <div class="flex gap-3 mt-4">

                            <button
                                class="edit-btn bg-yellow-500 text-white px-4 py-2 rounded-lg"
                                data-id="${id}">

                                Edit

                            </button>

                            <button
                                class="delete-btn bg-red-600 text-white px-4 py-2 rounded-lg"
                                data-id="${id}">

                                Delete

                            </button>

                        </div>

                    `;


                    donationList.appendChild(
                        card
                    );

                });


            if (!found) {

                donationList.innerHTML = `

                    <p class="text-gray-500">
                        No matching donations found.
                    </p>

                `;

            }


            // =================================
            // EDIT BUTTONS
            // =================================

            document
                .querySelectorAll(".edit-btn")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            editDonation(
                                button.dataset.id,
                                donations
                            );

                        }
                    );

                });


            // =================================
            // DELETE BUTTONS
            // =================================

            document
                .querySelectorAll(".delete-btn")
                .forEach((button) => {

                    button.addEventListener(
                        "click",
                        () => {

                            deleteDonation(
                                button.dataset.id
                            );

                        }
                    );

                });


        } catch (error) {

            console.error(
                "Error loading donations:",
                error
            );

            donationList.innerHTML = `

                <p class="text-red-600">
                    Error loading donations.
                </p>

            `;

        }

    }


    // =========================================
    // EDIT DONATION
    // =========================================

    function editDonation(
        id,
        donations
    ) {

        const donation =
            donations[id];


        if (!donation) {

            return;

        }


        editingDonationId =
            id;


        donorName.value =
            donation.donorName || "";

        donorEmail.value =
            donation.donorEmail || "";

        donationAmount.value =
            donation.amount || "";

        donationType.value =
            donation.donationType || "";

        donationDate.value =
            donation.donationDate || "";

        donationNotes.value =
            donation.notes || "";


        formTitle.textContent =
            "Edit Donation";


        submitDonationBtn.textContent =
            "Update Donation";


        cancelEditBtn.classList.remove(
            "hidden"
        );


        window.scrollTo(
            {
                top: 0,
                behavior: "smooth"
            }
        );

    }


    // =========================================
    // DELETE DONATION
    // =========================================

    async function deleteDonation(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this donation?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const donationRef =
                ref(
                    db,
                    "donations/" + id
                );


            await remove(
                donationRef
            );


            alert(
                "Donation deleted successfully!"
            );


            loadDonations();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Delete failed: " +
                error.message
            );

        }

    }


    // =========================================
    // CANCEL EDIT
    // =========================================

    cancelEditBtn.addEventListener(
        "click",
        () => {

            resetForm();

        }
    );


    // =========================================
    // RESET FORM
    // =========================================

    function resetForm() {

        donationForm.reset();


        editingDonationId =
            null;


        formTitle.textContent =
            "Add Donation";


        submitDonationBtn.textContent =
            "Add Donation";


        cancelEditBtn.classList.add(
            "hidden"
        );

    }


    // =========================================
    // SEARCH
    // =========================================

    searchDonation.addEventListener(
        "input",
        () => {

            loadDonations();

        }
    );


    // =========================================
    // INITIAL LOAD
    // =========================================

    loadDonations();

</script>

</body>
</html>
