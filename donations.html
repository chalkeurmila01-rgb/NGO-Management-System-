<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Donation Management - NGO Management System</title>

<script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-50 text-gray-800"><!-- Navbar -->
<nav class="bg-blue-700 text-white p-4">

    <div class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>

        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">
            Back to Admin
        </a>

    </div>

</nav>


<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 py-10">

    <!-- Page Heading -->
    <div class="mb-8">

        <h2 class="text-3xl font-bold text-blue-700">
            Donation Management
        </h2>

        <p class="text-gray-600 mt-2">
            Add and manage NGO donation records.
        </p>

    </div>


    <!-- Add Donation Form -->
    <section class="bg-white p-6 rounded-xl shadow-md">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Add Donation
        </h3>


        <form id="donationForm">

            <!-- Donor Name -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donor Name
                </label>

                <input
                    type="text"
                    id="donorName"
                    placeholder="Enter donor name"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Donor Email -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donor Email
                </label>

                <input
                    type="email"
                    id="donorEmail"
                    placeholder="Enter donor email"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Amount -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Amount
                </label>

                <input
                    type="number"
                    id="donationAmount"
                    placeholder="Enter donation amount"
                    min="1"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Donation Type -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Type
                </label>

                <select
                    id="donationType"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

                    <option value="">
                        Select donation type
                    </option>

                    <option value="Money">
                        Money
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Clothes">
                        Clothes
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Date -->
            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Donation Date
                </label>

                <input
                    type="date"
                    id="donationDate"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>


            <!-- Notes -->
            <div class="mb-6">

                <label class="block font-medium mb-1">
                    Notes
                </label>

                <textarea
                    id="donationNotes"
                    placeholder="Enter donation details"
                    class="w-full border border-gray-300 rounded-lg p-3"></textarea>

            </div>


            <!-- Button -->
            <button
                type="submit"
                class="bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800">

                Add Donation

            </button>

        </form>

    </section>


    <!-- Donation Records -->
    <section class="bg-white p-6 rounded-xl shadow-md mt-8">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Donation Records
        </h3>


        <div id="donationList">

            <p class="text-gray-500">
                Loading donations...
            </p>

        </div>

    </section>

</main>


<!-- Footer -->
<footer class="bg-gray-800 text-white text-center p-5 mt-10">

    <p>
        NGO Management System
    </p>

    <p class="text-gray-400 text-sm mt-1">
        Donation Management
    </p>

    <p class="text-gray-400 text-sm mt-2">
        © 2026 NGO Management System
    </p>

</footer>


<!-- Authentication -->
<script type="module" src="auth.js"></script>


<!-- Donation Management -->
<script type="module">

    import {
        ref,
        push,
        set,
        get
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    import {
        db
    } from "./firebase.js";


    // =========================================
    // ELEMENTS
    // =========================================

    const donationForm =
        document.getElementById("donationForm");

    const donorName =
        document.getElementById("donorName");

    const donorEmail =
        document.getElementById("donorEmail");

    const donationAmount =
        document.getElementById("donationAmount");

    const donationType =
        document.getElementById("donationType");

    const donationDate =
        document.getElementById("donationDate");

    const donationNotes =
        document.getElementById("donationNotes");

    const donationList =
        document.getElementById("donationList");


    // =========================================
    // ADD DONATION
    // =========================================

    donationForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                donorName.value.trim();

            const email =
                donorEmail.value.trim();

            const amount =
                donationAmount.value;

            const type =
                donationType.value;

            const date =
                donationDate.value;

            const notes =
                donationNotes.value.trim();


            try {

                const donationsRef =
                    ref(db, "donations");


                const newDonationRef =
                    push(donationsRef);


                await set(
                    newDonationRef,
                    {

                        donorName: name,

                        donorEmail: email,

                        amount: Number(amount),

                        donationType: type,

                        donationDate: date,

                        notes: notes

                    }
                );


                alert(
                    "Donation added successfully!"
                );


                donationForm.reset();


                loadDonations();


            } catch (error) {

                console.error(
                    "Error adding donation:",
                    error
                );

                alert(
                    "Donation failed: " +
                    error.message
                );
            }

        }
    );


    // =========================================
    // LOAD DONATIONS
    // =========================================

    async function loadDonations() {

        try {

            const donationsRef =
                ref(db, "donations");


            const snapshot =
                await get(donationsRef);


            donationList.innerHTML = "";


            if (snapshot.exists()) {

                const donations =
                    snapshot.val();


                Object.keys(donations)
                    .forEach((id) => {

                        const donation =
                            donations[id];


                        const card =
                            document.createElement("div");


                        card.className =
                            "border border-gray-200 rounded-xl p-5 mb-4";


                        card.innerHTML = `

                            <h4 class="text-xl font-bold text-blue-700">
                                ${donation.donorName}
                            </h4>

                            <p class="text-gray-600 mt-2">
                                <strong>Email:</strong>
                                ${donation.donorEmail}
                            </p>

                            <p class="text-gray-600">
                                <strong>Amount:</strong>
                                ₹${donation.amount}
                            </p>

                            <p class="text-gray-600">
                                <strong>Type:</strong>
                                ${donation.donationType}
                            </p>

                            <p class="text-gray-600">
                                <strong>Date:</strong>
                                ${donation.donationDate}
                            </p>

                            <p class="text-gray-600">
                                <strong>Notes:</strong>
                                ${donation.notes || "No notes"}
                            </p>

                        `;


                        donationList.appendChild(
                            card
                        );

                    });


            } else {

                donationList.innerHTML = `

                    <p class="text-gray-500">
                        No donations found.
                    </p>

                `;

            }


        } catch (error) {

            console.error(
                "Error loading donations:",
                error
            );

            donationList.innerHTML = `

                <p class="text-red-600">
                    Error loading donations.
                </p>

            `;
        }

    }


    // =========================================
    // INITIAL LOAD
    // =========================================

    loadDonations();

</script>

</body>
</html>
