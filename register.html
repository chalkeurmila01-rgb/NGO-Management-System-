
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NGO Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">
                NGO Management System
            </h1>

            <a href="index.html" class="hover:underline">
                Home
            </a>
        </div>
    </nav>

    <!-- Registration Form -->
    <main class="flex justify-center items-center py-12 px-4">

        <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-md">

            <h2 class="text-3xl font-bold text-center text-blue-700 mb-2">
                Create Account
            </h2>

            <p class="text-center text-gray-500 mb-6">
                Register to use the NGO Management System
            </p>

            <form id="registerForm">

                <!-- Full Name -->
                <div class="mb-4">
                    <label class="block font-medium mb-1">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="block font-medium mb-1">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block font-medium mb-1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                        minlength="6"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Confirm Password -->
                <div class="mb-6">
                    <label class="block font-medium mb-1">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold hover:bg-blue-800">
                    Create Account
                </button>

            </form>

            <!-- Login Link -->
            <p class="text-center text-gray-600 mt-6">
                Already have an account?

                <a href="login.html"
                   class="text-blue-700 font-semibold hover:underline">
                    Login
                </a>
            </p>

        </div>

    </main>

</body>
  </html>
