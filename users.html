    <title>User Management - NGO Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-50 text-gray-800">

     NAVBAR
========================================= -->

    <div class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>

        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">

            Back to Admin

<!-- =========================================
     MAIN
========================================= -->

<main class="max-w-6xl mx-auto px-4 py-10">


    <h2 class="text-3xl font-bold text-blue-700 mb-2">
        User Management
    </h2>

    <p class="text-gray-600 mb-8">
        View and manage registered NGO users.
    </p>



    <!-- =========================================
         SEARCH USERS

    <section class="bg-white p-6 rounded-xl shadow-md mb-8">

     AUTHENTICATION
========================================= -->

<script
    type="module"
    src="auth.js">
</script>



<!-- =========================================
     FIREBASE USERS
========================================= -->

<script type="module">

import {
    ref,
    get,
    remove
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

import {
    db
} from "./firebase.js";



const userList =
    document.getElementById("userList");

const userSearch =
    document.getElementById("userSearch");

const userSearchBtn =
    document.getElementById("userSearchBtn");

const showAllBtn =
    document.getElementById("showAllBtn");



// =========================================
// LOAD USERS
// =========================================

async function loadUsers(searchText = "") {

    try {

        const snapshot =
            await get(
                ref(db, "users")
            );


        userList.innerHTML = "";


        if (!snapshot.exists()) {

            userList.innerHTML = `
                <p class="text-gray-500">
                    No registered users found.
                </p>
            `;

            return;
        }


        const users =
            snapshot.val();


        let found = false;


        Object.keys(users).forEach(function(id) {

            const user =
                users[id];


            const name =
                (user.name || "").toLowerCase();

            const email =
                (user.email || "").toLowerCase();


            const search =
                searchText.toLowerCase();


            if (
                search &&
                !name.includes(search) &&
                !email.includes(search)
            ) {

                return;

            }


            found = true;


            const div =
                document.createElement("div");


            div.className =
                "border border-gray-300 rounded-lg p-5 mb-4";


            div.innerHTML = `

                <h4 class="text-xl font-bold text-blue-700">
                    ${user.name || "No Name"}
                </h4>

                <p class="mt-2">
                    <strong>Email:</strong>
                    ${user.email || "No Email"}
                </p>

                <p>
                    <strong>User ID:</strong>
                    ${id}
                </p>

                <button
                    class="deleteUserBtn bg-red-600 text-white px-4 py-2 rounded-lg mt-4"
                    data-id="${id}">

                    Delete User

                </button>

            `;


            userList.appendChild(div);

        });


        if (!found) {

            userList.innerHTML = `
                <p class="text-red-600">
                    No matching users found.
                </p>
            `;

        }


    } catch (error) {

        console.error(
            "Load users error:",
            error
        );


        userList.innerHTML = `
            <p class="text-red-600">
                Error loading users:
                ${error.message}
            </p>
        `;

    }

}



// =========================================
// SEARCH
// =========================================

userSearchBtn.addEventListener(
    "click",
    function() {

        loadUsers(
            userSearch.value.trim()
        );

    }
);



// =========================================
// ENTER SEARCH
// =========================================

userSearch.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            loadUsers(
                userSearch.value.trim()
            );

        }

    }
);



// =========================================
// SHOW ALL
// =========================================

showAllBtn.addEventListener(
    "click",
    function() {

        userSearch.value = "";

        loadUsers("");

    }
);



// =========================================
// DELETE USER
// =========================================

document.addEventListener(
    "click",
    async function(event) {

        if (
            !event.target.classList.contains(
                "deleteUserBtn"
            )
        ) {

            return;

        }


        const userId =
            event.target.dataset.id;


        const confirmDelete =
            confirm(
                "Are you sure you want to delete this user?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            await remove(
                ref(
                    db,
                    "users/" + userId
                )
            );


            alert(
                "User deleted successfully!"
            );


            loadUsers(
                userSearch.value.trim()
            );


        } catch (error) {

            console.error(
                "Delete user error:",
                error
            );


            alert(
                "Failed to delete user: " +
                error.message
            );

        }

    }
);



// =========================================
// INITIAL LOAD
// =========================================

loadUsers("");

</script>

</body>

</html>
