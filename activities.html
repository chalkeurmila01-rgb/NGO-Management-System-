 <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    NGO Activities - NGO Management System
</title>

<script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-50 text-gray-800"><!-- Navbar -->

<nav class="bg-blue-700 text-white p-4">

    <div
        class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>


        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">

            Back to Admin

        </a>

    </div>

</nav>



<!-- Main Content -->

<main class="max-w-6xl mx-auto px-4 py-10">


    <!-- Page Heading -->

    <div class="mb-8">

        <h2 class="text-3xl font-bold text-blue-700">
            NGO Activities Management
        </h2>

        <p class="text-gray-600 mt-2">
            Add and manage NGO events, campaigns and activities.
        </p>

    </div>



    <!-- Add Activity -->

    <section
        class="bg-white p-6 rounded-xl shadow-md">

        <h3
            class="text-2xl font-bold text-blue-700 mb-6">

            Add NGO Activity

        </h3>


        <form id="activityForm">


            <!-- Activity Name -->

            <div class="mb-4">

                <label
                    class="block font-medium mb-1">

                    Activity Name

                </label>


                <input
                    type="text"
                    id="activityName"
                    placeholder="Enter activity name"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <!-- Activity Type -->

            <div class="mb-4">

                <label
                    class="block font-medium mb-1">

                    Activity Type

                </label>


                <select
                    id="activityType"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

                    <option value="">
                        Select activity type
                    </option>

                    <option value="Campaign">
                        Campaign
                    </option>

                    <option value="Event">
                        Event
                    </option>

                    <option value="Awareness Program">
                        Awareness Program
                    </option>

                    <option value="Social Service">
                        Social Service
                    </option>

                    <option value="Fundraising">
                        Fundraising
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <!-- Date -->

            <div class="mb-4">

                <label
                    class="block font-medium mb-1">

                    Activity Date

                </label>


                <input
                    type="date"
                    id="activityDate"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <!-- Location -->

            <div class="mb-4">

                <label
                    class="block font-medium mb-1">

                    Location

                </label>


                <input
                    type="text"
                    id="activityLocation"
                    placeholder="Enter activity location"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <!-- Description -->

            <div class="mb-6">

                <label
                    class="block font-medium mb-1">

                    Description

                </label>


                <textarea
                    id="activityDescription"
                    placeholder="Enter activity description"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3"
                    rows="4"></textarea>

            </div>



            <!-- Button -->

            <button
                type="submit"
                class="bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800">

                Add Activity

            </button>


        </form>

    </section>



    <!-- Activity Records -->

    <section
        class="bg-white p-6 rounded-xl shadow-md mt-8">

        <h3
            class="text-2xl font-bold text-blue-700 mb-6">

            Activity Records

        </h3>


        <div id="activityList">

            <p class="text-gray-500">
                No activities loaded yet.
            </p>

        </div>

    </section>


</main>



<!-- Footer -->

<footer
    class="bg-gray-800 text-white text-center p-5 mt-10">

    <p>
        NGO Management System
    </p>


    <p class="text-gray-400 text-sm mt-1">
        NGO Activities Management
    </p>


    <p class="text-gray-400 text-sm mt-2">
        © 2026 NGO Management System
    </p>

</footer>



<!-- Authentication -->

<script
    type="module"
    src="auth.js">
</script>

</body></html>
