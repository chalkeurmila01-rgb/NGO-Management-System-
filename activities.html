<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NGO Activities - NGO Management System</title>

<script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-50 text-gray-800"><!-- Navbar -->

<nav class="bg-blue-700 text-white p-4">

    <div class="max-w-6xl mx-auto flex justify-between items-center">

        <h1 class="text-xl font-bold">
            NGO Management System
        </h1>

        <a
            href="admin.html"
            class="bg-white text-blue-700 px-4 py-2 rounded-lg font-semibold">
            Back to Admin
        </a>

    </div>

</nav>


<!-- Main Content -->

<main class="max-w-6xl mx-auto px-4 py-10">


    <!-- Heading -->

    <div class="mb-8">

        <h2 class="text-3xl font-bold text-blue-700">
            NGO Activities Management
        </h2>

        <p class="text-gray-600 mt-2">
            Add and manage NGO events, campaigns and activities.
        </p>

    </div>



    <!-- Add Activity -->

    <section class="bg-white p-6 rounded-xl shadow-md">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Add NGO Activity
        </h3>


        <form id="activityForm">


            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Activity Name
                </label>

                <input
                    type="text"
                    id="activityName"
                    placeholder="Enter activity name"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Activity Type
                </label>

                <select
                    id="activityType"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

                    <option value="">
                        Select activity type
                    </option>

                    <option value="Campaign">
                        Campaign
                    </option>

                    <option value="Event">
                        Event
                    </option>

                    <option value="Awareness Program">
                        Awareness Program
                    </option>

                    <option value="Social Service">
                        Social Service
                    </option>

                    <option value="Fundraising">
                        Fundraising
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Activity Date
                </label>

                <input
                    type="date"
                    id="activityDate"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <div class="mb-4">

                <label class="block font-medium mb-1">
                    Location
                </label>

                <input
                    type="text"
                    id="activityLocation"
                    placeholder="Enter activity location"
                    required
                    class="w-full border border-gray-300 rounded-lg p-3">

            </div>



            <div class="mb-6">

                <label class="block font-medium mb-1">
                    Description
                </label>

                <textarea
                    id="activityDescription"
                    placeholder="Enter activity description"
                    required
                    rows="4"
                    class="w-full border border-gray-300 rounded-lg p-3"></textarea>

            </div>



            <button
                type="submit"
                class="bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">

                Add Activity

            </button>

        </form>

    </section>



    <!-- Activity Records -->

    <section class="bg-white p-6 rounded-xl shadow-md mt-8">

        <h3 class="text-2xl font-bold text-blue-700 mb-6">
            Activity Records
        </h3>


        <!-- Search -->

        <div class="flex flex-col md:flex-row gap-3 mb-6">

            <input
                type="text"
                id="activitySearch"
                placeholder="Search activities..."
                class="flex-1 border border-gray-300 rounded-lg p-3">


            <button
                type="button"
                id="activitySearchBtn"
                class="bg-blue-700 text-white px-6 py-3 rounded-lg">

                Search

            </button>

        </div>


        <!-- Activity List -->

        <div id="activityList">

            <p class="text-gray-500">
                No activities loaded yet.
            </p>

        </div>

    </section>


</main>



<!-- Footer -->

<footer class="bg-gray-800 text-white text-center p-5 mt-10">

    <p>
        NGO Management System
    </p>

    <p class="text-gray-400 text-sm mt-1">
        NGO Activities Management
    </p>

    <p class="text-gray-400 text-sm mt-2">
        © 2026 NGO Management System
    </p>

</footer>



<!-- Authentication -->

<script type="module" src="auth.js"></script>



<!-- Firebase Activities -->

<script type="module">

    import {
        ref,
        push,
        set,
        get
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


    import {
        db
    } from "./firebase.js";



    const activityForm =
        document.getElementById("activityForm");


    const activityList =
        document.getElementById("activityList");


    const activitySearch =
        document.getElementById("activitySearch");


    const activitySearchBtn =
        document.getElementById("activitySearchBtn");



    // =========================================
    // ADD ACTIVITY
    // =========================================

    activityForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const activityName =
                document.getElementById(
                    "activityName"
                ).value.trim();


            const activityType =
                document.getElementById(
                    "activityType"
                ).value;


            const activityDate =
                document.getElementById(
                    "activityDate"
                ).value;


            const activityLocation =
                document.getElementById(
                    "activityLocation"
                ).value.trim();


            const activityDescription =
                document.getElementById(
                    "activityDescription"
                ).value.trim();


            try {

                const newActivityRef =
                    push(
                        ref(db, "activities")
                    );


                await set(
                    newActivityRef,
                    {

                        activityName:
                            activityName,

                        activityType:
                            activityType,

                        activityDate:
                            activityDate,

                        location:
                            activityLocation,

                        description:
                            activityDescription

                    }
                );


                alert(
                    "Activity added successfully!"
                );


                activityForm.reset();


                loadActivities();

            }


            catch (error) {

                console.error(
                    "Activity error:",
                    error
                );


                alert(
                    "Failed to add activity: " +
                    error.message
                );

            }

        }
    );



    // =========================================
    // LOAD ACTIVITIES
    // =========================================

    async function loadActivities(
        searchText = ""
    ) {

        try {

            const snapshot =
                await get(
                    ref(
                        db,
                        "activities"
                    )
                );


            activityList.innerHTML = "";


            if (!snapshot.exists()) {

                activityList.innerHTML = `
                    <p class="text-gray-500">
                        No activities found.
                    </p>
                `;

                return;

            }


            const activities =
                snapshot.val();


            let found = false;


            Object.keys(activities).forEach(
                function(id) {

                    const activity =
                        activities[id];


                    const search =
                        searchText
                            .toLowerCase();


                    const name =
                        (
                            activity.activityName || ""
                        ).toLowerCase();


                    const type =
                        (
                            activity.activityType || ""
                        ).toLowerCase();


                    const location =
                        (
                            activity.location || ""
                        ).toLowerCase();


                    const description =
                        (
                            activity.description || ""
                        ).toLowerCase();


                    const date =
                        (
                            activity.activityDate || ""
                        ).toLowerCase();



                    const matches =
                        name.includes(search) ||
                        type.includes(search) ||
                        location.includes(search) ||
                        description.includes(search) ||
                        date.includes(search);


                    if (!matches) {

                        return;

                    }


                    found = true;


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "border border-gray-300 rounded-lg p-5 mb-4";


                    div.innerHTML = `

                        <h4 class="text-xl font-bold text-blue-700">
                            ${activity.activityName}
                        </h4>

                        <p class="mt-2">
                            <strong>Type:</strong>
                            ${activity.activityType}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${activity.activityDate}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            ${activity.location}
                        </p>

                        <p>
                            <strong>Description:</strong>
                            ${activity.description}
                        </p>

                    `;


                    activityList.appendChild(
                        div
                    );

                }
            );


            if (!found) {

                activityList.innerHTML = `
                    <p class="text-red-600">
                        No matching activities found.
                    </p>
                `;

            }


        }


        catch (error) {

            console.error(
                "Loading activities error:",
                error
            );


            activityList.innerHTML = `
                <p class="text-red-600">
                    Error loading activities.
                </p>
            `;

        }

    }



    // =========================================
    // SEARCH BUTTON
    // =========================================

    activitySearchBtn.addEventListener(
        "click",
        function() {

            const searchText =
                activitySearch.value.trim();


            loadActivities(
                searchText
            );

        }
    );



    // =========================================
    // SEARCH WITH ENTER KEY
    // =========================================

    activitySearch.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                const searchText =
                    activitySearch.value.trim();


                loadActivities(
                    searchText
                );

            }

        }
    );



    // =========================================
    // INITIAL LOAD
    // =========================================

    loadActivities();

</script>

</body></html>
